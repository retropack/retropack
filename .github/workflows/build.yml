name: build

# Reusable build/test/publish pipeline (spec §9.2). Primary trigger is the
# tool repos' release.yml stub (workflow_call); workflow_dispatch lets a
# maintainer run it straight from the brain — publish+accept default OFF
# there so a direct run can never create releases by accident.

on:
  workflow_call:
    inputs:
      tool:
        description: "tool name, e.g. cc65"
        required: true
        type: string
      version:
        description: "upstream version, e.g. 2.19"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tool:
        description: "tool name, e.g. cc65"
        required: true
        type: string
      version:
        description: "upstream version, e.g. 2.19"
        required: true
        type: string
      publish:
        description: "also run publish + accept (requires release rights in this repo)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # create release, tags
  id-token: write        # attestation signing
  attestations: write
  issues: write          # build-failure issues

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.idem.outputs.skip }}
      platform_independent: ${{ steps.manifest.outputs.platform_independent }}
      matrix: ${{ steps.manifest.outputs.matrix }}
      timeout: ${{ steps.manifest.outputs.timeout }}
    steps:
      # Runs in the tool repo's context — brain files must be checked out
      # explicitly (spec §9.2).
      - uses: actions/checkout@v4
        with:
          repository: retropack/retropack

      # Parse tools/<tool>/tool.toml → job outputs (spec §9.2.1).
      - id: manifest
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          python3 - "$TOOL" <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, sys, tomllib
          tool = sys.argv[1]
          t = tomllib.load(open(pathlib.Path("tools") / tool / "tool.toml", "rb"))
          runners = {
              "linux-x86_64": "ubuntu-latest",
              "linux-aarch64": "ubuntu-24.04-arm",
              "macos-aarch64": "macos-latest",
          }
          if t["tool"]["platform_independent"]:
              # noarch: build once, publish.sh fans out to the three asset names.
              matrix = [{"platform": "noarch", "runner": "ubuntu-latest"}]
          else:
              matrix = [{"platform": p, "runner": r} for p, r in runners.items()]
          print(f"platform_independent={str(t['tool']['platform_independent']).lower()}")
          print(f"matrix={json.dumps(matrix)}")
          print(f"timeout={t['build'].get('timeout_minutes', 60)}")
          PY

      # Idempotency (spec §9.2.1): published release exists → skip downstream.
      # Query the releases LIST, not /releases/tags: drafts have no tag ref.
      - id: idem
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"v$VERSION\" and .draft == false)] | length")
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      # Platforms are independent — never cancel siblings; a red run must
      # still report what the other platforms did.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.timeout) }}
    env:
      TOOL: ${{ inputs.tool }}
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.platform }}
      WORK: ${{ github.workspace }}/work
      SRC: ${{ github.workspace }}/work/src
      PREFIX: ${{ github.workspace }}/work/${{ inputs.tool }}-${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: retropack/retropack

      - name: fetch source
        run: scripts/fetch-source.sh

      # The same case-dispatch scripts/local-build.sh runs locally (spec §6.2):
      # linux → docker/alpine wrapper, macos → native wrapper, noarch → direct.
      - name: build
        run: |
          OS=${PLATFORM%%-*}
          ARCH=${PLATFORM#*-}
          if [ "$PLATFORM" = "noarch" ]; then
            OS=noarch
            ARCH=noarch
          fi
          export OS ARCH
          export NPROC="${NPROC:-$(nproc 2>/dev/null || sysctl -n hw.ncpu)}"
          # §6.1 contract: build.sh reads these under set -u; wrappers set
          # their own platform presets — default whatever is left over.
          export CFLAGS="${CFLAGS:--O2}"
          export LDFLAGS="${LDFLAGS:-}"
          if [ "$PLATFORM" = "macos-aarch64" ]; then
            pkgs=$(python3 -c "
          import tomllib
          t = tomllib.load(open('tools/$TOOL/tool.toml', 'rb'))
          print(' '.join(t['build'].get('macos_packages', [])))
          ")
            if [ -n "$pkgs" ]; then
              read -r -a brew_pkgs <<< "$pkgs"
              brew install "${brew_pkgs[@]}"
            fi
          fi
          case "$PLATFORM" in
            linux-*) scripts/build-linux.sh ;;
            macos-*) scripts/build-macos.sh ;;
            noarch)  sh "tools/$TOOL/build.sh" ;;
            *) echo "unknown platform: $PLATFORM" >&2; exit 1 ;;
          esac

      - name: test
        run: '"tools/$TOOL/test.sh"'

      - name: portability
        run: scripts/check-portability.sh

      - name: package
        run: scripts/package.sh

      # Releases are the durable store — keep workflow artifacts short-lived
      # so they can't eat the free plan's 500 MB shared artifact allowance.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/*
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true' && inputs.publish != false
    runs-on: ubuntu-latest
    env:
      TOOL: ${{ inputs.tool }}
      VERSION: ${{ inputs.version }}
      PLATFORM_INDEPENDENT: ${{ needs.prepare.outputs.platform_independent }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: retropack/retropack

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # noarch fan-out + SHA256SUMS + per-asset .sha256 (spec §7.1).
      - name: prepare assets
        run: scripts/publish.sh assets

      # Attest the local files BEFORE the release becomes visible — users can
      # never observe unattested assets (spec §7.4 ordering intent).
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      # Spec §7.4 steps 1–4: published short-circuit, delete stale draft,
      # create draft targeting main, upload all assets.
      - name: upload release assets
        run: scripts/publish.sh upload

      # Spec §7.4 step 6: undraft, --latest only if this is the highest version.
      - name: publish release
        run: scripts/publish.sh release

  accept:
    needs: [prepare, publish]
    if: needs.prepare.outputs.skip != 'true' && inputs.publish != false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    env:
      TOOL: ${{ inputs.tool }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: retropack/retropack

      # Spec §9.2.4: prove autodetection, attestation verification and the
      # archive layout by installing exactly what a user would.
      - name: install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: acceptance install via mise
        run: MISE_GITHUB_TOKEN="${{ github.token }}" mise install "github:${GITHUB_REPOSITORY}@${VERSION}"

      - name: acceptance test
        run: |
          prefix=$(mise where "github:${GITHUB_REPOSITORY}@${VERSION}")
          export PREFIX="$prefix"
          "tools/$TOOL/test.sh"

  on-failure:
    if: failure()
    needs: [prepare, build, publish, accept]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TOOL: ${{ inputs.tool }}
      VERSION: ${{ inputs.version }}
      # Title must match spec §8.1 exactly: "build failure: <tool> <version>";
      # acceptance failures use "acceptance failure: <tool> <version>" so the
      # watcher still blocks retries but a human knows the release exists.
      TITLE_KIND: ${{ needs.accept.result == 'failure' && 'acceptance failure' || 'build failure' }}
      RESULTS: >-
        prepare=${{ needs.prepare.result }} build=${{ needs.build.result }}
        publish=${{ needs.publish.result }} accept=${{ needs.accept.result }}
    steps:
      - name: open or refresh build-failure issue
        run: |
          # Issue title formats (spec §8.1):
          #   "build failure: <tool> <version>"
          #   "acceptance failure: <tool> <version>"
          # — same build-failure label either way, so the watcher still
          # blocks retries while a human sees which stage broke.
          title="$TITLE_KIND: $TOOL $VERSION"
          gh label create build-failure --repo "$GITHUB_REPOSITORY" \
            --description "build broke; watcher blocks re-runs until closed (spec 8.1)" \
            --force
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"$'\n''Job results: '"$RESULTS"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=build-failure&state=open" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$existing/comments" \
              -f body="$body" > /dev/null
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --label build-failure --body "$body"
          fi
