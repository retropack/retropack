name: watch

on:
  schedule:
    - cron: "17 5 * * *"     # daily, off the hour (spec §8.2)
  workflow_dispatch:
    inputs:
      tool:
        description: "limit to one tool (optional)"
        required: false
      version:
        description: "force a specific version (bypasses released/blocked checks)"
        required: false
      dry_run:
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # M1: watch.py fetches upstream versions, diffs against published
      # releases and open build-failure issues, then repository_dispatches
      # retropack/<tool> (spec §8.1).
      # Inputs arrive via env, never interpolated into the script text —
      # ${{ }} inside run: is shell injection (security review).
      - name: detect missing (tool, version) pairs
        env:
          IN_TOOL: ${{ inputs.tool }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set --
          [ -n "$IN_TOOL" ] && set -- "$@" --tool "$IN_TOOL"
          [ -n "$IN_VERSION" ] && set -- "$@" --version "$IN_VERSION"
          [ "$IN_DRY_RUN" = "true" ] && set -- "$@" --dry-run
          python3 scripts/watch.py "$@"

  # Re-enable the workflow as the last step of every run — resets GitHub's
  # 60-day inactivity timer without a dummy commit (spec §8.3).
  keep-alive:
    if: always()
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/enable"
        env:
          GH_TOKEN: "${{ github.token }}"
