name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false     # PR code runs here (pytest); no token in .git

      # Lint tools come from mise.toml (hk, uv, shellcheck, yamllint,
      # actionlint) — identical versions locally and in CI, independent of whatever the
      # runner image preinstalls.
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # Nothing in this workflow installs Python packages (security review F6):
      # test deps are exact pins in the PEP 723 metadata of
      # scripts/run-tests.py, and hk's pytest step runs them through `uv run`
      # — the same command a local commit runs. uv brings its own Python
      # (requires-python there), so there is no separate Python-setup action.

      # The exact same gate as a local commit: shellcheck, yamllint,
      # actionlint, pytest (incl. workflow contracts + TOML schema).
      - run: hk check --all
