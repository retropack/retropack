[tasks.build]
description = "Local pipeline build of one tool for this machine: mise run build <tool> [version] (version defaults to latest upstream)"
run = "./scripts/local-build.sh"
# Upstream test suites (oscar64's autotest) emit raw binary bytes; raw mode
# skips mise's UTF-8 output decoding, which would otherwise abort the task.
raw = true

[tools]
hk = "latest"
uv = "latest"      # test-suite env: scripts/run-tests.py (PEP 723 pins)
shellcheck = "latest"
yamllint = "latest"
actionlint = "latest"
