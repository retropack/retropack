[tool]
name         = "kickc"
description  = "High-level C-like compiler for 6502/C64"
homepage     = "https://gitlab.com/camelot/kickc"
license      = "MIT"
license_files = ["LICENSE.txt"]
platform_independent = true
runtime_requirements = ["java>=11"]

[upstream]
type        = "gitlab"
repo        = "camelot/kickc"
tag_regex   = '^(?P<version>\d+\.\d+\.\d+)$'
min_version = "0.8.6"
skip_versions = []
max_per_run = 2

[source]
# Distribution zip: each GitLab release carries a "Binary" asset link (a
# shortener → GitLab wiki upload, per-version URL) — fetch-source resolves it
# at build time when build.mode = "repackage". This URL stays as the exact,
# version-stable reference to the upstream SOURCE (used for the notice and as
# a fallback).
url = "https://gitlab.com/camelot/kickc/-/archive/{version}/kickc-{version}.tar.gz"
strip_components = 1
release_asset = "Binary"

[build]
mode = "repackage"                  # upstream ships a distribution zip per release (spec §10)
alpine_packages = []                # noarch: runs directly on the runner, no container
macos_packages  = []
timeout_minutes = 30

[test]
expected_bins = ["kickc"]
