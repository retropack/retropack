[tool]
name         = "kickc"
description  = "High-level C-like compiler for 6502/C64"
homepage     = "https://kickc.jarl.dk"
license      = "MIT"
license_files = ["LICENSE.md"]
platform_independent = true
runtime_requirements = ["java>=11"]

[upstream]
type        = "gitlab"
repo        = "camelot/kickc"
tag_regex   = '^(?P<version>\d+\.\d+\.\d+)$'
min_version = "0.8.6"
skip_versions = []
max_per_run = 2

[source]
url = "https://gitlab.com/camelot/kickc/-/archive/{version}/kickc-{version}.tar.gz"
strip_components = 1

[build]
mode = "source"
alpine_packages = []
macos_packages  = []
timeout_minutes = 30

[test]
expected_bins = ["kickc"]
