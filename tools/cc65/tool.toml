[tool]
name         = "cc65"
description  = "C compiler and assembler suite for 6502 systems"
homepage     = "https://cc65.github.io"
license      = "Zlib"
license_files = ["LICENSE"]
platform_independent = false
runtime_requirements = []

[upstream]
type        = "github"
repo        = "cc65/cc65"
tag_regex   = '^V(?P<version>\d+\.\d+(?:\.\d+)?)$'
min_version = "2.19"
skip_versions = []
max_per_run = 2

[source]
url = "https://github.com/cc65/cc65/archive/refs/tags/V{version}.tar.gz"
strip_components = 1

[build]
mode = "source"
alpine_packages = ["build-base"]
macos_packages  = []
timeout_minutes = 30

[test]
expected_bins = ["cc65", "ca65", "ld65", "cl65", "ar65", "co65", "da65", "od65", "sp65", "grc65", "sim65"]
